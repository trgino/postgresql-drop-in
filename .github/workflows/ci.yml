name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: PHP lint ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: php -l on every file
        # The fixtures hold deliberately broken files (the scanner tests them).
        run: find . -name '*.php' -not -path './vendor/*' -not -path './tools/corpus/out/*' -not -path './tests/fixtures/*' -print0 | xargs -0 -n1 php -l > /dev/null

  quality:
    name: PHPCS + PHPStan + PHPUnit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer
          extensions: pdo_pgsql, mysqli
      - run: composer install --no-interaction --prefer-dist
      - run: composer lint
      - run: composer analyse
      - run: composer test

  pg-accept:
    name: PostgreSQL acceptance (PREPARE)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: slonik_php
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          extensions: pdo_pgsql
      - run: composer install --no-interaction --prefer-dist
      - name: Prepare every fixture statement
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: slonik_php
        run: php tools/pg-accept/run.php

  mysql-oracle:
    name: MySQL oracle (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: MySQL 5.7
            image: mysql:5.7
            health: mysqladmin ping -h 127.0.0.1 -proot
          - name: MySQL 8.4
            image: mysql:8.4
            health: mysqladmin ping -h 127.0.0.1 -proot
          - name: MariaDB 10.11
            image: mariadb:10.11
            health: healthcheck.sh --connect --innodb_initialized
    services:
      mysql:
        image: ${{ matrix.image }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: mysql
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: mysql
        ports:
          - 3306:3306
        options: >-
          --health-cmd="${{ matrix.health }}"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          extensions: mysqli
      - name: The golden values are the same on this version
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: '3306'
          MYSQL_USER: root
          MYSQL_PASSWORD: root
          MYSQL_DATABASE: mysql
        run: php tools/pg-accept/oracle.php

  corpus-smoke:
    name: Corpus capture smoke (MySQL, WP latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p tools/corpus/out && chmod 777 tools/corpus/out
      - run: docker compose -f tools/corpus/docker-compose.yml run --rm wpcli sh /corpus/run.sh
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - run: php tools/corpus/stats.php tools/corpus/out/corpus-raw.jsonl --dedupe=tools/corpus/out/corpus-v0.jsonl
      - uses: actions/upload-artifact@v4
        with:
          name: corpus-v0
          path: tools/corpus/out/corpus-v0.jsonl
